# cargo-deny checks the external dependency graph of each locked Rust component.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "NCSA", # Permissive licence for libFuzzer.
    "Unicode-3.0",
    "Unicode-DFS-2016", # Permissive Unicode data files licence for ruff_unicode_names2.
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
