name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@d7039efe6d8c441f1f213c674902909e80535599 # v0.5.0
    with:
      required-checks: |
        .github/workflows/ci.yml: test (3.14)
