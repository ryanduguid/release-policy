name: Reusable VirusTotal release scan

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag whose assets are uploaded to VirusTotal.
        required: true
        type: string
    secrets:
      vt-api-key:
        description: VirusTotal API key. Only the upload step receives it.
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: upload release assets to VirusTotal
    # Pinned whilst ubuntu-latest moves to 26.04 (actions/runner-images#14748), as the
    # release families are, so a scan never changes image between releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # Download the published release assets.
    outputs:
      manifest: ${{ steps.assets.outputs.manifest }}
    steps:
      - name: Download the release assets and check their digests
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          if [[ $visibility != public ]]; then
            echo "VirusTotal submissions require a public repository" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -e '.draft == false and (.assets | length) > 0' release.json >/dev/null \
            || { echo "$TAG is not a published release with assets" >&2; exit 1; }
          jq -e 'all(.assets[]; .size | type == "number" and . >= 0 and . <= 650000000)' \
            release.json >/dev/null || { echo "Invalid asset size or over 650 MB" >&2; exit 1; }
          jq -r '.assets[] | "\(.digest // "" | ltrimstr("sha256:"))  assets/\(.name)"' \
            release.json > digests.txt
          # Asset names reach curl -F and Markdown links, so admit only plain file names.
          # A leading dot is refused because the upload loop's glob skips dotfiles.
          if grep -Evxq '[0-9a-f]{64}  assets/[A-Za-z0-9_+-][A-Za-z0-9._+-]*' digests.txt; then
            echo "A release asset has no SHA-256 digest or an unexpected name" >&2
            exit 1
          fi
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          sha256sum --check --strict digests.txt
          test "$(find assets -type f | wc -l)" -eq "$(wc -l < digests.txt)"
          manifest=$(jq -c '[.id, .draft, ([.assets[] | [.name, .digest]] | sort)]' release.json | sha256sum)
          echo "manifest=${manifest%% *}" >> "$GITHUB_OUTPUT"

      - name: Upload each asset to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.vt-api-key }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # A malformed key yields an HTTP/2 stream reset or a bare 400, so check its shape first.
          if [[ ! $VT_API_KEY =~ ^[0-9a-f]{64}$ ]]; then
            echo "VT_API_KEY is not a 64-character lower-case hexadecimal VirusTotal key (length ${#VT_API_KEY})" >&2
            exit 1
          fi
          # Keep the key off curl's command line.
          printf 'header = "x-apikey: %s"\n' "$VT_API_KEY" > "$RUNNER_TEMP/vt.curl"
          response="$RUNNER_TEMP/vt.json"
          upload_config="$RUNNER_TEMP/vt-upload.curl"
          trap 'rm -f "$RUNNER_TEMP/vt.curl" "$response" "$upload_config"' EXIT
          first=1
          request() {
            # Count URL lookups and file submissions against the same four requests a minute.
            [ "$first" = 1 ] || sleep 16
            first=0
            curl --disable --globoff --proto '=https' --fail --silent --config "$RUNNER_TEMP/vt.curl" \
              --output "$response" "$@" || { echo "VirusTotal request failed for $f" >&2; return 1; }
          }
          api=https://www.virustotal.com/api/v3/files
          for f in assets/*; do
            size=$(stat -c %s -- "$f")
            if (( size > 32 * 1024 * 1024 )); then
              request "$api/upload_url"
              # Keep the single-use URL out of arguments and logs. The API returns an address on
              # bigfiles.virustotal.com; its documented example is on www.virustotal.com over
              # HTTP. Contact either host only over HTTPS. Never follow redirects.
              jq -er '.data | strings
                | sub("^http:"; "https:")
                | select(startswith("https://www.virustotal.com/")
                    or startswith("https://bigfiles.virustotal.com/"))
                | select(test("[[:space:][:cntrl:]]") | not)
                | "url = " + @json' "$response" > "$upload_config" \
                || { echo "Invalid VirusTotal upload URL" >&2; exit 1; }
              request --config "$upload_config" -F "file=@$f"
            else
              request "$api" -F "file=@$f"
            fi
            jq -e '.data | .type == "analysis" and (.id | type == "string" and length > 0)' "$response" >/dev/null
          done

  annotate:
    name: link the VirusTotal reports in the release notes
    needs: scan
    # Pinned with the scan job above.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Edit the release notes; immutable releases keep assets and tag locked.
    steps:
      - name: Replace the VirusTotal section of the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SCANNED_MANIFEST: ${{ needs.scan.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          manifest=$(jq -c '[.id, .draft, ([.assets[] | [.name, .digest]] | sort)]' release.json | sha256sum)
          if [[ ${manifest%% *} != "$SCANNED_MANIFEST" ]]; then
            echo "The release assets changed during the scan; rerun for the current release" >&2
            exit 1
          fi
          {
            jq -r '.body // "" | sub("[[:space:]]*<!-- virustotal:start -->.*<!-- virustotal:end -->"; ""; "m")
              | sub("[[:space:]]+$"; "")' release.json
            printf '\n<!-- virustotal:start -->\n## VirusTotal\n\n'
            jq -r '.assets[] | "- [\(.name)](https://www.virustotal.com/gui/file/\(.digest | ltrimstr("sha256:")))"' release.json
            printf '<!-- virustotal:end -->\n'
          } > notes.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$(jq -r .id release.json)" \
            -F body=@notes.md >/dev/null
