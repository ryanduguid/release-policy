name: PR review event probe

on:
  pull_request_target:
    types: [ready_for_review, converted_to_draft]
    branches: [main]
  workflow_run:
    workflows: [PR review trigger]
    types: [completed]

permissions: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record selected public event evidence
        env:
          EVIDENCE_JSON: >-
            {
              "schema": "pr_review_event_probe_v1",
              "event_name": ${{ toJSON(github.event_name) }},
              "event_action": ${{ toJSON(github.event.action) }},
              "server_url": ${{ toJSON(github.server_url) }},
              "repository": ${{ toJSON(github.repository) }},
              "repository_id": ${{ toJSON(github.repository_id) }},
              "repository_owner_id": ${{ toJSON(github.repository_owner_id) }},
              "consumer_run_id": ${{ toJSON(github.run_id) }},
              "consumer_run_number": ${{ toJSON(github.run_number) }},
              "consumer_run_attempt": ${{ toJSON(github.run_attempt) }},
              "workflow_ref": ${{ toJSON(github.workflow_ref) }},
              "workflow_sha": ${{ toJSON(github.workflow_sha) }},
              "ref": ${{ toJSON(github.ref) }},
              "sha": ${{ toJSON(github.sha) }},
              "pr_number": ${{ toJSON(github.event.number) }},
              "pr_draft": ${{ toJSON(github.event.pull_request.draft) }},
              "pr_author_id": ${{ toJSON(github.event.pull_request.user.id) }},
              "formatted_author_id": ${{ toJSON(format('{0}', github.event.pull_request.user.id)) }},
              "pr_head_sha": ${{ toJSON(github.event.pull_request.head.sha) }},
              "pr_head_repo_id": ${{ toJSON(github.event.pull_request.head.repo.id) }},
              "pr_base_sha": ${{ toJSON(github.event.pull_request.base.sha) }},
              "pr_base_repo_id": ${{ toJSON(github.event.pull_request.base.repo.id) }},
              "upstream_run_id": ${{ toJSON(github.event.workflow_run.id) }},
              "upstream_run_number": ${{ toJSON(github.event.workflow_run.run_number) }},
              "upstream_run_attempt": ${{ toJSON(github.event.workflow_run.run_attempt) }},
              "upstream_workflow_id": ${{ toJSON(github.event.workflow_run.workflow_id) }},
              "upstream_name": ${{ toJSON(github.event.workflow_run.name) }},
              "upstream_path": ${{ toJSON(github.event.workflow_run.path) }},
              "upstream_event": ${{ toJSON(github.event.workflow_run.event) }},
              "upstream_conclusion": ${{ toJSON(github.event.workflow_run.conclusion) }},
              "upstream_actor_id": ${{ toJSON(github.event.workflow_run.actor.id) }},
              "formatted_upstream_actor_id": ${{ toJSON(format('{0}', github.event.workflow_run.actor.id)) }},
              "upstream_triggering_actor_id": ${{ toJSON(github.event.workflow_run.triggering_actor.id) }},
              "upstream_head_sha": ${{ toJSON(github.event.workflow_run.head_sha) }},
              "upstream_repository_id": ${{ toJSON(github.event.workflow_run.repository.id) }},
              "upstream_head_repository_id": ${{ toJSON(github.event.workflow_run.head_repository.id) }},
              "sender_id": ${{ toJSON(github.event.sender.id) }},
              "consumer_actor_id": ${{ toJSON(github.actor_id) }},
              "predicate": ${{ toJSON(
            github.run_attempt == 1 && (
                  (github.event_name == 'pull_request_target' &&
                   !github.event.pull_request.draft && github.event.pull_request.user.id && github.repository_owner_id &&
                   format('{0}', github.event.pull_request.user.id) == github.repository_owner_id) ||
                  (github.event_name == 'workflow_run' && github.server_url == 'https://github.com' &&
                   github.event.workflow_run.conclusion == 'success' &&
                   github.event.workflow_run.actor.id && format('{0}', github.event.workflow_run.actor.id) == '49699333') ||
                  github.event_name == 'workflow_dispatch')
            ) }}
            }
        run: printf '%s\n' "$EVIDENCE_JSON"
