name: Independent PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [PR review trigger]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open PR number to review
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.run_attempt == 1 && (
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft && github.event.pull_request.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    # Pin the full reviewed commit containing the reusable reviewer workflow.
    uses: ryanduguid/release-policy/.github/workflows/pr-review.yml@d4abeb9450821c1f2721b7575a3f11d3e7dbcaa7
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
