name: PR review trigger

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  trigger:
    if: ${{ github.server_url == 'https://github.com' && github.actor_id == '49699333' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'
