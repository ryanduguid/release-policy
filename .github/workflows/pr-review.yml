name: Independent PR review

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: false

permissions:
  contents: read

# One run per PR or Dependabot bridge run. Never cancel a run after it has
# written pending; a forced cancellation can still leave pending, which is
# deliberately unable to authorise a merge.
concurrency:
  group: independent-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.inputs.pr-number }}
  cancel-in-progress: false

jobs:
  capture:
    name: Freeze review context
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir evidence
      - name: Capture and scan immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py capture --publish-pending
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --gitleaks "$GITHUB_WORKSPACE/gitleaks"
      - name: Fail the captured head if capture did not finish
        if: ${{ always() && job.status != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py fail
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json
      - name: Retain evidence for this run
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          retention-days: 1
          if-no-files-found: error

  review:
    name: GLM and MiMo independent review
    if: ${{ github.run_attempt == 1 }}
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Download this run's frozen context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Set up the engine's locked installer
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Install trusted PR-Agent without model credentials
        shell: bash
        run: |
          set -euo pipefail
          git init engine
          git -C engine remote add origin https://github.com/The-PR-Agent/pr-agent.git
          git -C engine fetch --depth=1 origin 1d01f24f455bb879c1d9c557ad7de3d72dcc7975
          git -C engine checkout --detach FETCH_HEAD
          cd engine
          uv sync --frozen --python 3.12 --no-dev
      - name: Review both models against identical frozen context
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          engine/.venv/bin/python policy/scripts/pr_review.py review
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --report evidence/review.json
      - name: Retain validated reviews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/review.json
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish advisory status
    needs: [capture, review]
    if: ${{ always() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Download captured identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Download completed reviews
        if: ${{ needs.capture.result == 'success' && needs.review.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Validate coverage and current revision before publication
        if: ${{ needs.capture.result == 'success' && needs.review.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py publish --jobs-ok
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --report evidence/review.json
      - name: Publish failure for a failed, skipped or cancelled review
        if: ${{ always() && (job.status != 'success' || needs.capture.result != 'success' || needs.review.result != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py fail
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json
