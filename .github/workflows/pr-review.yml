name: Independent PR review

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: installed
      pr-url:
        type: string
        default: ""
    secrets:
      OPENROUTER_API_KEY:
        required: false

permissions:
  contents: read

# One run per PR or Dependabot bridge run. Never cancel a run after it has
# written pending; a forced cancellation can still leave pending, which is
# deliberately unable to authorise a merge.
concurrency:
  group: independent-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.inputs.pr-number || github.run_id }}
  cancel-in-progress: false

# CI follows Python 3.14 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"

jobs:
  capture:
    name: Freeze review context
    if: ${{ github.run_attempt == 1 && inputs.mode == 'installed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      disposition: ${{ steps.capture_context.outputs.capture_disposition }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Validate installed mode inputs
        env:
          CENTRAL_PR_URL: ${{ inputs.pr-url }}
        run: test -z "$CENTRAL_PR_URL"
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir evidence
      - name: Capture and scan immutable source
        id: capture_context
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py capture --publish-pending
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --gitleaks "$GITHUB_WORKSPACE/gitleaks"
      - name: Fail the captured head if capture did not finish
        if: ${{ always() && job.status != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py fail
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json
      - name: Retain evidence for this run
        if: ${{ always() && steps.capture_context.outputs.capture_disposition != 'closed_before_admission' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          retention-days: 1
          if-no-files-found: error

  central_capture:
    name: Freeze public upstream context
    if: ${{ github.run_attempt == 1 && inputs.mode != 'installed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Validate owner dispatch and public URL before source access
        env:
          REVIEW_MODE: ${{ inputs.mode }}
          PUBLIC_PR_URL: ${{ inputs.pr-url }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review_public.py gate --mode "$REVIEW_MODE" --url "$PUBLIC_PR_URL"
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir evidence
      - name: Capture and scan public source without a GitHub token
        env:
          PUBLIC_PR_URL: ${{ inputs.pr-url }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review_public.py capture --url "$PUBLIC_PR_URL"
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --gitleaks "$GITHUB_WORKSPACE/gitleaks"
      - name: Retain this run's frozen public source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/snapshot.json
          retention-days: 1
          if-no-files-found: error

  review:
    name: GLM and MiMo independent review
    if: >-
      !cancelled() && github.run_attempt == 1 &&
      ((needs.capture.result == 'success' && needs.capture.outputs.disposition == 'captured') ||
       needs.central_capture.result == 'success')
    needs: [capture, central_capture]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Download this run's frozen context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Set up the engine's locked installer
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Install trusted PR-Agent without model credentials
        shell: bash
        run: |
          set -euo pipefail
          git init engine
          git -C engine remote add origin https://github.com/The-PR-Agent/pr-agent.git
          git -C engine fetch --depth=1 origin 3be92e293fc55b24a54aa303595e9eaa32519954
          git -C engine checkout --detach FETCH_HEAD
          cd engine
          uv sync --frozen --python 3.14 --no-dev --no-install-project --no-build --no-cache \
            --no-install-package giteapy --no-install-package html2text
          uv pip install --python .venv/bin/python --require-hashes --only-binary :all: \
            --no-deps --no-cache --requirement ../policy/.github/pr-review-build-wheels.txt
          .venv/bin/python ../policy/scripts/pr_review_install.py prepare .
          uv pip install --python .venv/bin/python --require-hashes --no-build-isolation \
            --no-deps --no-cache --offline --requirement pr-review-source-exceptions.txt
          uv pip uninstall --python .venv/bin/python setuptools wheel
          uv sync --frozen --python 3.14 --no-dev --no-install-project --no-build --no-cache \
            --no-install-package giteapy --no-install-package html2text --inexact --check
          uv export --frozen --no-dev --no-emit-project --no-hashes --no-header --no-annotate \
            --no-cache --output-file pr-review-runtime-requirements.txt
          .venv/bin/python ../policy/scripts/pr_review_install.py verify .
          uv pip check --python .venv/bin/python
      - name: Review both models against identical frozen context
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/engine
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          engine/.venv/bin/python policy/scripts/pr_review.py review
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --report evidence/review.json
      - name: Retain sanitised receipts even when output validation fails
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/review.receipts.json
          retention-days: 30
          if-no-files-found: error
      - name: Retain validated reviews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/review.json
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish advisory status
    needs: [capture, review]
    if: >-
      always() && github.run_attempt == 1 && inputs.mode == 'installed' &&
      !(needs.capture.result == 'success' && needs.capture.outputs.disposition == 'closed_before_admission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Reject a missing or invalid capture disposition
        if: ${{ needs.capture.result == 'success' }}
        env:
          CAPTURE_DISPOSITION: ${{ needs.capture.outputs.disposition }}
        run: test "$CAPTURE_DISPOSITION" = captured
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Download captured identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Download completed reviews
        if: ${{ needs.capture.result == 'success' && needs.review.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Validate coverage and current revision before publication
        id: publish_report
        if: ${{ needs.capture.result == 'success' && needs.review.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py publish --jobs-ok
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --report evidence/review.json
      - name: Publish failure for a failed, skipped or cancelled review
        if: ${{ always() && (steps.publish_report.outcome != 'success' || needs.capture.result != 'success' || needs.review.result != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review.py fail
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json

  central_summary:
    name: Report public review without publishing upstream
    needs: [central_capture, review]
    if: >-
      !cancelled() && github.run_attempt == 1 && inputs.mode == 'central_public_report_v1' &&
      needs.central_capture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Download captured public context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Download complete validated reviews
        if: ${{ needs.review.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Check current identity and render the public report
        env:
          POLICY_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 policy/scripts/pr_review_public.py summary
          --policy policy/.github/pr-review-policy.json --policy-sha "$POLICY_SHA"
          --snapshot evidence/snapshot.json --report evidence/review.json
