name: Reusable source archive release

on:
  workflow_call:
    inputs:
      artifact-stem:
        description: Lower-case hyphenated stem used for all release assets.
        required: true
        type: string
      version-file:
        description: Safe relative path containing one canonical MAJOR.MINOR.PATCH line.
        required: false
        type: string
        default: VERSION

permissions:
  contents: read

jobs:
  consumer-tests:
    timeout-minutes: 15
    name: run consumer source-archive tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Tests execute consumer-controlled code. Keep their processes and
      # GITHUB_ENV/GITHUB_PATH changes on this separate read-only runner.
      - name: Check out the tagged consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: consumer
          persist-credentials: false

      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require an immutable policy pin
        env:
          MODULE_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is not a 40-hex policy commit" >&2; exit 1; }
          test "$(git -C policy rev-parse HEAD)" = "$MODULE_SHA"

      # Consumers declare their own pinned test dependencies. Install exactly
      # what is listed and nothing else: --no-deps drops transitive runtime
      # requirements, and --only-binary refuses sdists, so pip never builds a
      # package and never resolves unpinned PEP 518 build requirements onto
      # this runner. A pinned line with no wheel fails the step rather than
      # widening what it installs.
      - name: Install pinned consumer test dependencies
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          test -f requirements-test.txt || exit 0
          python -m pip install --disable-pip-version-check --no-deps --only-binary :all: --requirement requirements-test.txt

      - name: Run the standard source-archive regression suite
        working-directory: consumer
        run: python -B -m unittest discover -s tests -v

  release:
    needs: consumer-tests
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-archives.yml
    with:
      artifact-stem: ${{ inputs.artifact-stem }}
      version-file: ${{ inputs.version-file }}
