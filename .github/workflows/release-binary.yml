name: Reusable Rust binary release

# One tag, one publisher, one immutable release: the deterministic source
# archives and a prebuilt executable for each fixed target. Consumer code
# (tests and build scripts) runs only in the read-only build jobs, and the
# fetched third-party tools (Syft, cargo-audit and a rustup toolchain) only in
# the read-only admit job. The publisher holds the write, OIDC and attestation
# scopes. It runs no consumer code, no Cargo and none of those tools, and it
# treats every build artefact and everything the admit job hands over as
# untrusted input.

on:
  workflow_call:
    inputs:
      artifact-stem:
        description: Lower-case hyphenated stem used for all release assets.
        required: true
        type: string
      binary:
        description: >-
          Cargo binary targets to ship, separated by spaces: each the package's
          own name or a declared [[bin]]. Defaults to the artifact stem.
        required: false
        type: string
        default: ""
      data-files:
        description: >-
          Files the executables need at run time, one path per line relative to
          source-directory. Each archive ships each one, under the last part of
          its path, byte for byte as tagged.
        required: false
        type: string
        default: ""
      source-directory:
        description: Tracked crate directory containing Cargo.toml and VERSION.
        required: false
        type: string
        default: .
      tag-prefix:
        description: Optional lower-case hyphenated namespace for the release tag.
        required: false
        type: string
        default: ""
      required-checks:
        description: >-
          Mandatory consumer checks, one per line as "<workflow path>: <job name>",
          that must have succeeded in a push or dispatch run of main for the exact
          release commit before anything is built. Fails closed when empty.
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 15
    name: require the consumer's mandatory checks
    # Pinned whilst ubuntu-latest moves to 26.04 (actions/runner-images#14748), so a
    # release never changes image mid-run. Move every release family together.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Read this repository's own workflow runs for the release commit.
    steps:
      # This job never checks out or executes consumer code, so the Actions
      # read scope the gate needs is not held by any job that runs it.
      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Require an immutable policy pin
        env:
          MODULE_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is not a 40-hex policy commit" >&2; exit 1; }
          test "$(git -C policy rev-parse HEAD)" = "$MODULE_SHA"

      # Head equality here, before any wait, means the run uses main's current
      # caller workflow, policy pin and required checks. Later re-checks accept
      # a merge that leaves the component and this caller untouched.
      - name: Require the release commit to be main's head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          . policy/scripts/gates.sh
          gate_main_matches "$GITHUB_SHA" "$GITHUB_REPOSITORY"

      - name: Require the mandatory consumer checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED_CHECKS" \
            | python policy/scripts/required_checks.py \
                --repository "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" \
                --wait-seconds 600

  build:
    timeout-minutes: 45
    name: build, test and package ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # Each target builds natively on its own runner, so its tests and the
        # smoke test run the shipped executable.
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    defaults:
      run:
        shell: bash
    # gates.sh and build_binary.sh default to python3, which the Windows
    # image may not provide.
    env:
      PYTHON: python
    steps:
      # The Windows image converts line endings on checkout; the packaged
      # documents must be the tagged blobs, which the publisher compares.
      - name: Check out files exactly as committed
        run: git config --global core.autocrlf false

      # Tests and build scripts execute consumer-controlled code. Keep them on
      # this read-only runner; nothing here reaches the publisher except the
      # uploaded artefact, which the publisher validates.
      - name: Check out the tagged consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: consumer
          persist-credentials: false

      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Require an immutable policy pin
        env:
          MODULE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is not a 40-hex policy commit" >&2; exit 1; }
          test "$(git -C policy rev-parse HEAD)" = "$MODULE_SHA"

      - name: Validate the component release inputs
        id: inputs
        env:
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        working-directory: consumer
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          write_release_input_outputs "$SOURCE_DIRECTORY" "$TAG_PREFIX" consumer

      - name: Read the release version and binary
        id: release
        env:
          ARTIFACT_STEM: ${{ inputs.artifact-stem }}
          BINARY: ${{ inputs.binary }}
          SOURCE_DIRECTORY: ${{ steps.inputs.outputs.source-directory }}
        working-directory: consumer
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          { read -r stem; read -r version; } < <(
            derive_archive_metadata "$ARTIFACT_STEM" VERSION "$SOURCE_DIRECTORY"
          )
          binary="${BINARY:-$stem}"
          python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" cargo-package \
            --manifest "$SOURCE_DIRECTORY/Cargo.toml" --version "$version" --binary "$binary"
          epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          {
            echo "stem=$stem"
            echo "version=$version"
            echo "binary=$binary"
            echo "epoch=$epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Install the pinned cargo-auditable
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      # Set only in the Windows job, so the executable needs no C runtime DLL.
      - name: Link the C runtime statically
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Test, build, package and check the executables
        env:
          TARGET: ${{ matrix.target }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
          BINARY: ${{ steps.release.outputs.binary }}
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          EPOCH: ${{ steps.release.outputs.epoch }}
          DATA_FILES: ${{ inputs.data-files }}
        run: >-
          bash "$GITHUB_WORKSPACE/policy/scripts/build_binary.sh"
          "$TARGET" "$STEM" "$VERSION" "$BINARY" "$SOURCE_PATH"
          "$GITHUB_WORKSPACE/consumer" "$RUNNER_TEMP/binary" "$EPOCH" "$DATA_FILES"

      - name: Hand the archive and its digest to the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/binary/
          if-no-files-found: error
          overwrite: false
          retention-days: 3

  # Admission, linkage, the SBOMs and the RustSec audit run here, read-only,
  # because they rely on fetched third-party tools and data: Syft, a rustup
  # toolchain, the cargo-audit installer and the RustSec advisory database.
  # The publisher admits and rebuilds every archive again and takes only the
  # SBOMs from this job: its outputs carry digests, not authority.
  admit:
    needs: [checks, build]
    timeout-minutes: 20
    name: admit, describe and audit the binary release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc
    outputs:
      source-zip: ${{ steps.digests.outputs.source-zip }}
      source-tar: ${{ steps.digests.outputs.source-tar }}
      linux-archive: ${{ steps.digests.outputs.linux-archive }}
      linux-arm64-archive: ${{ steps.digests.outputs.linux-arm64-archive }}
      macos-arm64-archive: ${{ steps.digests.outputs.macos-arm64-archive }}
      windows-archive: ${{ steps.digests.outputs.windows-archive }}
      source-sbom: ${{ steps.digests.outputs.source-sbom }}
      linux-sbom: ${{ steps.digests.outputs.linux-sbom }}
      linux-arm64-sbom: ${{ steps.digests.outputs.linux-arm64-sbom }}
      macos-arm64-sbom: ${{ steps.digests.outputs.macos-arm64-sbom }}
      windows-sbom: ${{ steps.digests.outputs.windows-sbom }}
    steps:
      - name: Check out the tagged consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: consumer
          persist-credentials: false

      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Require an immutable policy pin
        env:
          MODULE_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is not a 40-hex policy commit" >&2; exit 1; }
          test "$(git -C policy rev-parse HEAD)" = "$MODULE_SHA"

      - name: Validate the component release inputs
        id: inputs
        env:
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          write_release_input_outputs "$SOURCE_DIRECTORY" "$TAG_PREFIX" consumer

      # Derived as the build jobs derive it, so this job needs no token. The
      # publisher runs the release gates itself.
      - name: Read the release version, binary and package
        id: release
        working-directory: consumer
        env:
          ARTIFACT_STEM: ${{ inputs.artifact-stem }}
          BINARY: ${{ inputs.binary }}
          SOURCE_DIRECTORY: ${{ steps.inputs.outputs.source-directory }}
        shell: bash
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          { read -r stem; read -r version; } < <(
            derive_archive_metadata "$ARTIFACT_STEM" VERSION "$SOURCE_DIRECTORY"
          )
          binary="${BINARY:-$stem}"
          package="$(python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" cargo-package \
            --manifest "$SOURCE_DIRECTORY/Cargo.toml" --version "$version" --binary "$binary")"
          {
            echo "stem=$stem"
            echo "version=$version"
            echo "binary=$binary"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"

      - name: Build deterministic source archives
        working-directory: consumer
        env:
          TZ: UTC
          SOURCE_DIRECTORY: ${{ steps.inputs.outputs.source-directory }}
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/policy/scripts/build_release_archives.py" \
            --commit "$GITHUB_SHA" \
            --prefix "$STEM-$VERSION/" \
            --source-directory "$SOURCE_DIRECTORY" \
            --output-base "$SOURCE_PATH/dist/$STEM-$VERSION"

      - name: Generate an SPDX SBOM for the source ZIP archive
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.zip
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Exact names from this run, never a pattern, so another job's upload
      # cannot be taken for a target's archive.
      - name: Download the Linux build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/x86_64-unknown-linux-musl

      - name: Download the Linux arm64 build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-aarch64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/aarch64-unknown-linux-musl

      - name: Download the macOS arm64 build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-aarch64-apple-darwin
          path: ${{ runner.temp }}/incoming/aarch64-apple-darwin

      - name: Download the Windows build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/incoming/x86_64-pc-windows-msvc

      # The build jobs ran consumer code, so their artefacts are untrusted
      # input: exact files, matching digest line, safe members, then admission.
      - name: Validate and admit each target's archive
        env:
          BINARY: ${{ steps.release.outputs.binary }}
          DATA_FILES: ${{ inputs.data-files }}
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" receive \
              --incoming "$RUNNER_TEMP/incoming/$target" --stem "$STEM" --version "$VERSION" \
              --binary "$BINARY" --target "$target" --dist "$SOURCE_PATH/dist" \
              --extract-dir "$RUNNER_TEMP/extracted/$target" \
              --source "$SOURCE_PATH" --root "$GITHUB_WORKSPACE/consumer" \
              --data-files "$DATA_FILES"
          done

      - name: Require each admitted executable's linkage
        env:
          BINARY: ${{ steps.release.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          bash "$GITHUB_WORKSPACE/policy/scripts/admitted_linkage.sh" \
            "$RUNNER_TEMP/extracted" "$BINARY" "${targets[@]}"

      # Only the executables: a data file such as a lock file in the admitted
      # directory would add packages the target does not ship.
      - name: Stage each target's executables for its SBOM
        env:
          BINARY: ${{ steps.release.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            suffix=""
            [[ "$target" != *-windows-msvc ]] || suffix=.exe
            mkdir -p "$RUNNER_TEMP/sbom/$target"
            for name in $BINARY; do
              cp "$RUNNER_TEMP/extracted/$target/$name$suffix" "$RUNNER_TEMP/sbom/$target/"
            done
          done

      # Syft reads the dependency lists cargo-auditable embedded for the exact
      # target in each of the target's staged executables. It runs
      # from the workspace root, outside the consumer tree, so no consumer
      # file configures it.
      - name: Generate the Linux binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/x86_64-unknown-linux-musl
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-unknown-linux-musl.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the Linux arm64 binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/aarch64-unknown-linux-musl
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-unknown-linux-musl.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the macOS arm64 binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/aarch64-apple-darwin
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-apple-darwin.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the Windows binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/x86_64-pc-windows-msvc
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-pc-windows-msvc.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Require each binary SBOM to list the package
        working-directory: ${{ steps.inputs.outputs.source-path }}
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          BASE: ${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" sbom-lists \
              --sbom "dist/$BASE-$target.spdx.json" --package "$PACKAGE"
          done

      # cargo-audit reads the same embedded dependency lists. The policy pins
      # the tool and fetches a fresh advisory database, and the script runs it
      # outside the consumer tree, so no consumer file can waive an advisory.
      - name: Install the pinned cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Refuse any RustSec advisory against an admitted executable
        env:
          BINARY: ${{ steps.release.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          executables=()
          for target in $TARGETS; do
            suffix=""
            [[ "$target" != *-windows-msvc ]] || suffix=.exe
            for name in $BINARY; do
              executables+=("$RUNNER_TEMP/extracted/$target/$name$suffix")
            done
          done
          bash "$GITHUB_WORKSPACE/policy/scripts/audit_binaries.sh" "$RUNNER_TEMP/advisory-db" \
            "${executables[@]}"

      # Each output is one 64-hex SHA-256, refused otherwise, here and again
      # by the publisher.
      - name: Record the SHA-256 of each file for the publisher
        id: digests
        env:
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: >-
          python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" digests
          --dist "$SOURCE_PATH/dist" --stem "$STEM" --version "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Hand the admitted archives and SBOMs to the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admitted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.inputs.outputs.source-path }}/dist/
          if-no-files-found: error
          overwrite: false
          retention-days: 3

  publish:
    needs: [checks, build, admit]
    timeout-minutes: 20
    name: gate, attest and publish the binary release
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc
    steps:
      - name: Check out the tagged consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: consumer
          persist-credentials: false

      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Require an immutable policy pin
        env:
          MODULE_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is not a 40-hex policy commit" >&2; exit 1; }
          test "$(git -C policy rev-parse HEAD)" = "$MODULE_SHA"

      - name: Validate the component release inputs
        id: inputs
        env:
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          write_release_input_outputs "$SOURCE_DIRECTORY" "$TAG_PREFIX" consumer

      - name: Require a release-ready tag, repository and archive contract
        id: release
        working-directory: consumer
        env:
          ARTIFACT_STEM: ${{ inputs.artifact-stem }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIRECTORY: ${{ steps.inputs.outputs.source-directory }}
          TAG_PREFIX: ${{ steps.inputs.outputs.tag-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          run_archive_release_gates \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$ARTIFACT_STEM" \
            VERSION \
            "$SOURCE_DIRECTORY" \
            "$TAG_PREFIX"

      # Read as data with tomllib: Cargo never runs in this job.
      - name: Require the Cargo package, binary and toolchain to match the release
        id: binary
        working-directory: consumer
        env:
          BINARY: ${{ inputs.binary }}
          SOURCE_DIRECTORY: ${{ steps.release.outputs.source-directory }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          binary="${BINARY:-$STEM}"
          package="$(python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" cargo-package \
            --manifest "$SOURCE_DIRECTORY/Cargo.toml" --version "$VERSION" --binary "$binary")"
          python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" toolchain \
            --source "$SOURCE_DIRECTORY" --root .
          {
            echo "binary=$binary"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"

      - name: Build deterministic source archives
        working-directory: consumer
        env:
          TZ: UTC
          COMMIT: ${{ steps.release.outputs.commit }}
          PREFIX: ${{ steps.release.outputs.prefix }}
          SOURCE_DIRECTORY: ${{ steps.inputs.outputs.source-directory }}
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/policy/scripts/build_release_archives.py" \
            --commit "$COMMIT" \
            --prefix "$PREFIX" \
            --source-directory "$SOURCE_DIRECTORY" \
            --output-base "$SOURCE_PATH/dist/$STEM-$VERSION"

      # Exact names from this run, never a pattern, so another job's upload
      # cannot be taken for a target's archive.
      - name: Download the Linux build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/x86_64-unknown-linux-musl

      - name: Download the Linux arm64 build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-aarch64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/aarch64-unknown-linux-musl

      - name: Download the macOS arm64 build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-aarch64-apple-darwin
          path: ${{ runner.temp }}/incoming/aarch64-apple-darwin

      - name: Download the Windows build artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ github.run_id }}-${{ github.run_attempt }}-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/incoming/x86_64-pc-windows-msvc

      # The build jobs ran consumer code, so their artefacts are untrusted
      # input: exact files, matching digest line, safe members, then admission.
      # The admit job did the same; admitting again here is what lets this job
      # refuse an archive the admit job changed along with its digest.
      - name: Validate and admit each target's archive
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
          DATA_FILES: ${{ inputs.data-files }}
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" receive \
              --incoming "$RUNNER_TEMP/incoming/$target" --stem "$STEM" --version "$VERSION" \
              --binary "$BINARY" --target "$target" --dist "$SOURCE_PATH/dist" \
              --extract-dir "$RUNNER_TEMP/extracted/$target" \
              --source "$SOURCE_PATH" --root "$GITHUB_WORKSPACE/consumer" \
              --data-files "$DATA_FILES"
          done

      - name: Download the admit job's archives and SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admitted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admitted

      # Exactly the expected files, each matching its digest output, and each
      # archive byte for byte this job's own. Only the SBOMs are kept.
      - name: Accept the admit job's SBOMs once its archives match this job's
        env:
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_ZIP: ${{ needs.admit.outputs.source-zip }}
          SOURCE_TAR: ${{ needs.admit.outputs.source-tar }}
          LINUX_ARCHIVE: ${{ needs.admit.outputs.linux-archive }}
          LINUX_ARM64_ARCHIVE: ${{ needs.admit.outputs.linux-arm64-archive }}
          MACOS_ARM64_ARCHIVE: ${{ needs.admit.outputs.macos-arm64-archive }}
          WINDOWS_ARCHIVE: ${{ needs.admit.outputs.windows-archive }}
          SOURCE_SBOM: ${{ needs.admit.outputs.source-sbom }}
          LINUX_SBOM: ${{ needs.admit.outputs.linux-sbom }}
          LINUX_ARM64_SBOM: ${{ needs.admit.outputs.linux-arm64-sbom }}
          MACOS_ARM64_SBOM: ${{ needs.admit.outputs.macos-arm64-sbom }}
          WINDOWS_SBOM: ${{ needs.admit.outputs.windows-sbom }}
        shell: bash
        run: >-
          python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" accept
          --incoming "$RUNNER_TEMP/admitted" --dist "$SOURCE_PATH/dist"
          --stem "$STEM" --version "$VERSION"
          --digest "source-zip=$SOURCE_ZIP" --digest "source-tar=$SOURCE_TAR"
          --digest "linux-archive=$LINUX_ARCHIVE"
          --digest "linux-arm64-archive=$LINUX_ARM64_ARCHIVE"
          --digest "macos-arm64-archive=$MACOS_ARM64_ARCHIVE"
          --digest "windows-archive=$WINDOWS_ARCHIVE"
          --digest "source-sbom=$SOURCE_SBOM" --digest "linux-sbom=$LINUX_SBOM"
          --digest "linux-arm64-sbom=$LINUX_ARM64_SBOM"
          --digest "macos-arm64-sbom=$MACOS_ARM64_SBOM"
          --digest "windows-sbom=$WINDOWS_SBOM"

      - name: Require each binary SBOM to list the package
        working-directory: ${{ steps.inputs.outputs.source-path }}
        env:
          PACKAGE: ${{ steps.binary.outputs.package }}
          BASE: ${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" sbom-lists \
              --sbom "dist/$BASE-$target.spdx.json" --package "$PACKAGE"
          done

      - name: Write and verify the exact release asset inventory
        working-directory: ${{ steps.inputs.outputs.source-path }}
        env:
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          listing="$(python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" assets \
            --stem "$STEM" --version "$VERSION")"
          mapfile -t assets <<< "$listing"
          expected_before="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
          actual_before="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_before" = "$expected_before"
          (
            cd dist
            sha256sum -- "${assets[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          expected_after="$(printf '%s\n' SHA256SUMS "${assets[@]}" | LC_ALL=C sort)"
          actual_after="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_after" = "$expected_after"

      - name: Attest release asset provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.zip
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.tar.gz
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.spdx.json
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-unknown-linux-musl.spdx.json
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-unknown-linux-musl.spdx.json
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-apple-darwin.tar.gz
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-apple-darwin.spdx.json
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-pc-windows-msvc.zip
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-pc-windows-msvc.spdx.json
            ${{ steps.inputs.outputs.source-root }}/dist/SHA256SUMS

      # The signed bundle becomes a release asset so a downloader can verify
      # without the attestation API. SHA256SUMS cannot list it: the
      # attestation covers that file and is created after it.
      - name: Write the provenance bundle as a release asset
        working-directory: ${{ steps.inputs.outputs.source-path }}
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          BASE: ${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/$BASE.intoto.jsonl"
          test ! -e "$bundle"
          cp -- "$BUNDLE_PATH" "$bundle"
          # Exactly one Sigstore bundle on one JSON line.
          jq -se 'length == 1' "$bundle" >/dev/null
          test "$(wc -l < "$bundle")" -eq 1

      - name: Attest the SPDX SBOM for both source archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.zip
            ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.tar.gz
          sbom-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.spdx.json

      - name: Attest the Linux binary's SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
          sbom-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-unknown-linux-musl.spdx.json

      - name: Attest the Linux arm64 binary's SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
          sbom-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-unknown-linux-musl.spdx.json

      - name: Attest the macOS arm64 binary's SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-apple-darwin.tar.gz
          sbom-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-aarch64-apple-darwin.spdx.json

      - name: Attest the Windows binary's SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-pc-windows-msvc.zip
          sbom-path: ${{ steps.inputs.outputs.source-root }}/dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-x86_64-pc-windows-msvc.spdx.json

      - name: Verify provenance and SBOM attestations before publication
        working-directory: ${{ steps.inputs.outputs.source-path }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_SHA: ${{ job.workflow_sha }}
          STEM: ${{ steps.release.outputs.stem }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          base="dist/$STEM-$VERSION"
          signer="ryanduguid/release-policy/.github/workflows/release-binary.yml"
          listing="$(python "$GITHUB_WORKSPACE/policy/scripts/binary_release.py" assets \
            --stem "$STEM" --version "$VERSION")"
          mapfile -t names <<< "$listing"
          assets=() archives=()
          for name in "${names[@]}"; do
            assets+=("dist/$name")
            [[ "$name" == *.spdx.json ]] || archives+=("dist/$name")
          done
          assets+=(dist/SHA256SUMS)
          pins=(
            --repo "$GITHUB_REPOSITORY"
            --source-digest "$COMMIT"
            --source-ref "refs/tags/$TAG"
            --signer-workflow "$signer"
            --signer-digest "$MODULE_SHA"
          )
          for file in "${assets[@]}"; do
            gh attestation verify "$file" "${pins[@]}"
            gh attestation verify "$file" --bundle "$base.intoto.jsonl" "${pins[@]}"
          done
          for archive in "${archives[@]}"; do
            gh attestation verify "$archive" "${pins[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Re-check the remote tag, main and release absence
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
          SOURCE_DIRECTORY: ${{ steps.release.outputs.source-directory }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag_commit="$(git ls-remote \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG^{}" | cut -f1)"
          test -n "$remote_tag_commit"
          test "$remote_tag_commit" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          . "$GITHUB_WORKSPACE/policy/scripts/gates.sh"
          gate_main_contains "$EXPECTED_COMMIT" "$GITHUB_REPOSITORY" "$SOURCE_DIRECTORY"
          gate_no_existing_release "$TAG" "$GITHUB_REPOSITORY"

      - name: Create, inspect and publish the immutable release
        working-directory: consumer
        env:
          ARTIFACT_STEM: ${{ steps.release.outputs.stem }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_DIRECTORY: ${{ steps.release.outputs.source-directory }}
          SOURCE_PATH: ${{ steps.inputs.outputs.source-path }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/policy/scripts/publish_binaries.sh" \
            "$RELEASE_TAG" \
            "$EXPECTED_COMMIT" \
            "$ARTIFACT_STEM" \
            "$RELEASE_VERSION" \
            "$SOURCE_PATH" \
            "$SOURCE_DIRECTORY"
