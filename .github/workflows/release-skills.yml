name: Reusable skill-pack release

on:
  workflow_call:
    inputs:
      artifact-stem:
        description: Lower-case hyphenated stem used for all release assets.
        required: true
        type: string
      skills-verification-mode:
        description: Closed policy-owned skill-pack verification mode.
        required: false
        type: string
        default: subcontractor-accounting-v1
      required-checks:
        description: >-
          Mandatory consumer checks, one per line as "<workflow path>: <job name>",
          that must have succeeded in a push or dispatch run of main for the exact
          release commit before anything is verified or built. Fails closed when empty.
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    # Outlasts the gate's bounded wait, as the other families' checks jobs do.
    timeout-minutes: 15
    name: guard skill-pack release mode
    # Pinned whilst ubuntu-latest moves to 26.04 (actions/runner-images#14748), so a
    # release never changes image mid-run. Move every release family together.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Read this repository's own workflow runs for the release commit.
    steps:
      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Require an immutable policy pin
        env:
          MODULE_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is not a 40-hex policy commit" >&2; exit 1; }
          test "$(git -C policy rev-parse HEAD)" = "$MODULE_SHA"
      # Head equality here, before any wait, means the run uses main's current
      # caller workflow, policy pin and required checks. The publish job's later
      # re-checks accept a merge that leaves the component and this caller untouched.
      - name: Require the release commit to be main's head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          . policy/scripts/gates.sh
          gate_main_matches "$GITHUB_SHA" "$GITHUB_REPOSITORY"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Guard the selected mode and frozen tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SKILLS_VERIFICATION_MODE: ${{ inputs.skills-verification-mode }}
        run: >-
          python policy/scripts/verify_skills.py guard-release
          --mode "$SKILLS_VERIFICATION_MODE"
          --tag "$RELEASE_TAG"
      - name: Require the mandatory consumer checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED_CHECKS" \
            | python policy/scripts/required_checks.py \
                --repository "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" \
                --wait-seconds 600

  verify:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/verify-skills.yml
    with:
      skills-verification-mode: ${{ inputs.skills-verification-mode }}

  publish:
    needs: [guard, verify]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-archives.yml
    with:
      required-checks: ${{ inputs.required-checks }}
      artifact-stem: ${{ inputs.artifact-stem }}
