name: Reusable Python release

on:
  workflow_call:
    inputs:
      version-command:
        description: >-
          Optional shell command printing the package version, for projects
          whose pyproject.toml declares version as dynamic.
        required: false
        type: string
        default: ""
      upload-dist-artifact:
        description: >-
          Upload the built wheel and source distribution as a run artifact so a
          caller-side job can publish them. PyPI cannot name a reusable workflow
          as a Trusted Publisher (pypi/warehouse#11096), so the publish step has
          to run in the calling repository's own workflow.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    timeout-minutes: 15
    name: gate, build, attest and publish
    runs-on: ubuntu-latest
    outputs:
      stem: ${{ steps.release.outputs.stem }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the tagged consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out release-policy at the calling pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          # job.workflow_sha is the resolved SHA of this reusable workflow
          # (the reusable-workflow analogue of the OIDC job_workflow_sha
          # claim; GHES-unavailable; actionlint false positive tracked in
          # rhysd/actionlint#707).
          ref: ${{ job.workflow_sha }}
          path: .release-policy
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the locked toolchain
        run: python -m pip install "uv==0.12.0"

      - name: Require an immutable module pin
        env:
          # job.workflow_sha is the resolved SHA of this reusable workflow
          # (the reusable-workflow analogue of the OIDC job_workflow_sha
          # claim; GHES-unavailable; actionlint false positive tracked in
          # rhysd/actionlint#707).
          MODULE_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "job.workflow_sha is empty or not a 40-hex SHA; refusing to run with an unverifiable policy checkout" >&2; exit 1; }
          actual="$(git -C .release-policy rev-parse HEAD)"
          [ "$actual" = "$MODULE_SHA" ] \
            || { echo "release-policy checkout is $actual, expected $MODULE_SHA" >&2; exit 1; }

      - name: Require a release-ready tag and repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_COMMAND: ${{ inputs.version-command }}
        shell: bash
        run: |
          set -euo pipefail
          . .release-policy/scripts/gates.sh
          run_release_gates "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$VERSION_COMMAND"

      - name: Run the locked test suite
        run: uv run --locked --extra dev --python 3.12 pytest

      - name: Build wheel and source distribution
        env:
          PYTHONHASHSEED: "0"
        shell: bash
        run: |
          set -euo pipefail
          # Pin the same determinism inputs tests/test_determinism.sh proves,
          # so the shipped wheel carries the reproducibility the test asserts.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv run --locked --extra dev --python 3.12 python -m build

      - name: Generate SPDX SBOM for the wheel
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-py3-none-any.whl
          format: spdx-json
          syft-version: v1.51.0
          output-file: dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.whl *.tar.gz *.spdx.json > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Attest the wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}-py3-none-any.whl
          sbom-path: dist/${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}.spdx.json

      - name: Upload the distribution for a caller-side publish
        if: inputs.upload-dist-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.release.outputs.stem }}-${{ steps.release.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
