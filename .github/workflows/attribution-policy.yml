name: Attribution policy

# Shared runner behind every consumer's `No AI attribution` workflow. The
# consumer calls this on pull_request_target, pushes to main and manual
# dispatch; the caller's event context is visible here, so the status lands on
# the caller's head commit. It runs the composite action, which checks out the
# base branch only and never executes pull request code.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    timeout-minutes: 10
    name: Attribution policy runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Mark the head commit as pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_CONTEXT: ${{ github.event_name == 'pull_request_target' && 'Attribution policy' || 'Attribution audit' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --method POST \
            -f state=pending -f context="$POLICY_CONTEXT" \
            -f description='Checking commit identities and authorship credits' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

      - uses: ryanduguid/release-policy/.github/actions/no-ai-attribution@d19c3db7450488fc349726f6300319f9a1830126

      - name: Publish the result on the head commit
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_CONTEXT: ${{ github.event_name == 'pull_request_target' && 'Attribution policy' || 'Attribution audit' }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --method POST \
            -f state="$STATE" -f context="$POLICY_CONTEXT" \
            -f description='Commit identity and authorship credit policy' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
