name: CI

on:
  workflow_dispatch:
    inputs:
      live-canary-audit:
        description: Audit current consumer pins and live release evidence
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * 2"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: fuzz policy parsers
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the pinned fuzzer
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-fuzz.txt

      - name: Fuzz pure policy parsers
        run: >-
          python -m fuzz.policy_parsers fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  rust-fuzzing:
    name: fuzz the Rust policy parsers
    # The same 60-second exploration, over the same corpus, for the Rust CLI.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned fuzzer
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
          # install-action has no cargo-fuzz manifest, so the release asset is
          # checked against GitHub's digest for it at pin time.
          CARGO_FUZZ_SHA256: "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c"
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-15 --profile minimal
          asset="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/$asset"
          echo "${CARGO_FUZZ_SHA256}  $asset" | sha256sum --check
          tar -xzf "$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-fuzz

      - name: Fuzz pure policy parsers
        # The release binary is built for musl and defaults to that target,
        # where the address sanitiser cannot build; fuzz on glibc instead.
        run: >-
          cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu policy_parsers fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  checks:
    timeout-minutes: 15
    name: lint and test
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    # The 26.04 canary leg below reports but never fails the job, so ci-gates
    # stays green on its failure.
    continue-on-error: ${{ matrix.runner == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        # Test the Python 3.14 minimum and current stable Python 3.15.
        python: ["3.14", "3.15"]
        # Temporary leg on the image ubuntu-latest becomes between 19 October
        # and 19 November 2026 (actions/runner-images#14748). "3.14.x" makes it
        # a new combination, so the required check names above stay unchanged.
        # Remove it once ubuntu-latest is 26.04.
        include:
          - python: "3.14.x"
            runner: ubuntu-26.04
    env:
      # Follow the CI maintenance interpreter rather than the exact local pin.
      UV_PYTHON: ${{ matrix.python == '3.15' && '3.15' || '3.14' }}
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      # digest computed from the v0.11.0 release tarball at pin time
      # (koalaman does not publish a checksums file)
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # shellcheck and actionlint do not depend on the Python under test, so
      # they download and run once, on the 3.14 leg, like the live canary audit.
      - name: Download and verify shellcheck
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Shellcheck the scripts and tests
        if: matrix.python == '3.14'
        run: |
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -x scripts/*.sh tests/*.sh

      - name: Download and verify actionlint
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint

      # actionlint's bundled `job` context type does not yet model `workflow_sha`,
      # which is used by the release workflows. rhysd/actionlint#707 is open to
      # add it. Until that ships, ignore this one known false positive; remove the
      # -ignore flag once #707 lands in a release.
      - name: Actionlint the workflows
        if: matrix.python == '3.14'
        run: |
          ./actionlint \
            -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            -ignore 'property "workflow_sha" is not defined in object type \{check_run_id: number; container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}' \
            .github/workflows/*.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned Python tools
        run: >-
          python -m pip install
          --require-hashes --only-binary :all:
          --requirement requirements-ci.txt

      - name: Ruff the policy scripts and tests
        if: matrix.python == '3.14'
        run: python -m ruff check .

      - name: Type-check the policy scripts
        run: python -m mypy

      - name: Validate the release-family canary manifest
        if: matrix.python == '3.14'
        run: python scripts/check_canaries.py

      - name: Audit live canary pins and successful-run evidence
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.live-canary-audit)) &&
          matrix.python == '3.14'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_canaries.py --live --require-current-evidence

      - name: Check repository baseline
        if: matrix.python == '3.14'
        run: bash tests/test_repository_baseline.sh

      - name: Check the published prose for egress findings
        if: matrix.python == '3.14'
        # Layers B and C only: the layer A terms file is private and never
        # reaches CI, which is the point of keeping it out of the repository.
        # --allow-structural because SECURITY.md names a dotenv file in prose,
        # which is a shape layer B looks for and a person has already read.
        # docs/egress-check.md is excluded because it documents the reserved
        # namespace by naming it. The exclusion names the whole path, not the
        # file name, so another egress-check.md elsewhere under docs would
        # still be scanned. It is printed, and it fails if it ever stops
        # matching, so it cannot quietly become a hole.
        run: >-
          python scripts/check_egress.py
          README.md RELEASE_NOTES.md CONTRIBUTING.md SECURITY.md AGENTS.md docs
          --no-terms --allow-structural --exclude docs/egress-check.md

      - name: Run gate tests
        run: bash tests/test_gates.sh

      - name: Run commit-msg hook tests
        run: bash tests/test_commit_msg_hook.sh

      - name: Run policy tests with scoped branch coverage
        run: >-
          python -m coverage run --branch --source=scripts
          -m unittest discover -s tests -p "test_*.py" -v

      - name: Require complete changed-line coverage in Python policy scripts
        run: |
          python -m coverage xml --include="scripts/*.py" -o coverage.xml
          diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100

      - name: Require complete coverage of the policy scripts
        if: matrix.python == '3.15'
        run: python -m coverage report --fail-under=100

      - name: Write whole-package coverage for Codecov
        if: matrix.python == '3.15'
        run: python -m coverage xml -o coverage-codecov.xml

      - name: Keep the coverage report for the Codecov upload
        if: matrix.python == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1

      - name: Run determinism test
        run: bash tests/test_determinism.sh

      - name: Install the release toolchain's uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Build the demo package offline from its lock
        run: bash tests/test_offline_build.sh

  windows:
    timeout-minutes: 15
    name: shell tests (Windows, ${{ matrix.part }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # scripts/publish_common.sh writes fixed /tmp paths, so the
        # publication families cannot run concurrently on one runner.
        part: [gates, archives, python, binaries]
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install the pinned build tool
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-build.txt

      - name: Check repository baseline
        if: matrix.part == 'gates'
        run: bash tests/test_repository_baseline.sh

      - name: Run gate tests
        if: matrix.part == 'gates'
        # The publication families run in the other matrix legs.
        # test_gates.sh's byte-exact fixtures exercise CRLF regardless of checkout settings.
        env:
          GATES_SKIP_PUBLICATION: "1"
        run: bash tests/test_gates.sh

      - name: Run commit-msg hook tests
        if: matrix.part == 'gates'
        run: bash tests/test_commit_msg_hook.sh

      - name: Run determinism test
        if: matrix.part == 'gates'
        run: bash tests/test_determinism.sh

      - name: Run ${{ matrix.part }} publication tests
        if: matrix.part != 'gates'
        env:
          PART: ${{ matrix.part }}
        run: bash tests/test_publish_releases.sh "$PART"

  # The Rust CLI that replaces the policy scripts once a release of it is
  # published. Until then the reusable workflows keep calling the scripts,
  # so both are tested.
  rust:
    timeout-minutes: 30
    name: Rust CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # rust-toolchain.toml pins the same release.
      RUST_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt,llvm-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint the CLI and its tests
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run the CLI tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked

      # The floor is the measured line coverage, rounded down (92.15% on
      # 19 October 2026). Raise it with the tests, never lower it to pass.
      - name: Run the CLI tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --locked --lcov --output-path coverage-rust.lcov --fail-under-lines 92

      - name: Keep the Rust coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.lcov
          retention-days: 1

      # A second, release-profile compile that no CI step uses, so pull requests
      # skip it; the tests already run the debug binary. Main, the weekly run
      # and manual runs keep the documented release build compiling.
      - name: Build the release binary
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --bin release-policy

  # The binary release family's build path, run on this repository's own CLI
  # for both targets. It publishes nothing; binary-sbom-check then takes the
  # artefacts as the publisher would.
  binary-self-check:
    timeout-minutes: 45
    name: binary release self-check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      PYTHON: python
    steps:
      - name: Check out files exactly as committed
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the pinned cargo-auditable
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      - name: Install the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Link the C runtime statically
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Test, build, package and check the executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])' | tr -d '\r')"
          bash scripts/build_binary.sh "$TARGET" release-policy "$version" release-policy \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/binary" \
            "$(git log -1 --format=%ct)"

      - name: Keep the archive for the SBOM check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-self-check-${{ matrix.target }}
          path: ${{ runner.temp }}/binary/
          if-no-files-found: error
          retention-days: 1

  binary-sbom-check:
    timeout-minutes: 15
    name: binary release SBOM check
    needs: binary-self-check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download the Linux archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-self-check-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/x86_64-unknown-linux-musl

      - name: Download the Windows archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-self-check-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/incoming/x86_64-pc-windows-msvc

      - name: Admit each archive as the publisher does
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          for target in x86_64-unknown-linux-musl x86_64-pc-windows-msvc; do
            python scripts/binary_release.py receive \
              --incoming "$RUNNER_TEMP/incoming/$target" --stem release-policy --version "$version" \
              --binary release-policy --target "$target" --dist "$RUNNER_TEMP/dist" \
              --extract-dir "$RUNNER_TEMP/extracted/$target" --source . --root .
          done

      - name: Require each admitted executable's linkage as the publisher does
        run: bash scripts/admitted_linkage.sh "$RUNNER_TEMP/extracted" release-policy

      - name: Generate the Linux binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ runner.temp }}/extracted/x86_64-unknown-linux-musl/release-policy
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/linux.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the Windows binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ runner.temp }}/extracted/x86_64-pc-windows-msvc/release-policy.exe
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/windows.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # cargo-auditable embeds the target's own dependency list: a direct and
      # a transitive dependency on both, and each platform crate only on its
      # platform.
      - name: Require each SBOM to describe its own target's dependencies
        run: |
          set -euo pipefail
          lists() { python scripts/binary_release.py sbom-lists --sbom "$RUNNER_TEMP/$1.spdx.json" --package "$2"; }
          for sbom in linux windows; do
            for package in release-policy regex regex-automata; do
              lists "$sbom" "$package"
            done
          done
          lists linux rustix
          lists windows windows-sys
          if lists linux windows-sys || lists windows rustix; then
            echo "an SBOM lists another platform's crate" >&2
            exit 1
          fi

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from ci-gates: a Codecov outage must
  # not block merges.
  codecov:
    name: upload coverage to Codecov
    needs: [checks, rust]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-rust
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml,coverage-rust.lcov
          disable_search: true
          fail_ci_if_error: true

  ci-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [checks, windows, rust, binary-self-check, binary-sbom-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml ci-gates --exempt fuzzing --exempt rust-fuzzing --exempt codecov
