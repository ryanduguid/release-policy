name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: fuzz policy parsers
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the pinned fuzzer
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-fuzz.txt

      - name: Fuzz pure policy parsers
        run: >-
          python -m fuzz.policy_parsers fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  checks:
    timeout-minutes: 15
    name: lint and test
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    # The 26.04 canary leg below reports but never fails the job, so ci-gates
    # stays green on its failure.
    continue-on-error: ${{ matrix.runner == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        # Test the declared Python 3.14 minimum.
        python: ["3.14"]
        # Temporary leg on the image ubuntu-latest becomes between 19 October
        # and 19 November 2026 (actions/runner-images#14748). "3.14.x" makes it
        # a new combination, so the required check names above stay unchanged.
        # Remove it once ubuntu-latest is 26.04.
        include:
          - python: "3.14.x"
            runner: ubuntu-26.04
    env:
      # Follow the CI maintenance interpreter rather than the exact local pin.
      UV_PYTHON: "3.14"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      # digest computed from the v0.11.0 release tarball at pin time
      # (koalaman does not publish a checksums file)
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # shellcheck and actionlint do not depend on the Python under test, so
      # they download and run once, on the 3.14 leg, like the live canary audit.
      - name: Download and verify shellcheck
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Shellcheck the scripts and tests
        if: matrix.python == '3.14'
        run: |
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -x scripts/*.sh tests/*.sh

      - name: Download and verify actionlint
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint

      # actionlint's bundled `job` context type does not yet model `workflow_sha`,
      # which is used by the release workflows. rhysd/actionlint#707 is open to
      # add it. Until that ships, ignore this one known false positive; remove the
      # -ignore flag once #707 lands in a release.
      - name: Actionlint the workflows
        if: matrix.python == '3.14'
        run: |
          ./actionlint \
            -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            -ignore 'property "workflow_sha" is not defined in object type \{check_run_id: number; container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}' \
            .github/workflows/*.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned Python tools
        run: >-
          python -m pip install
          --require-hashes --only-binary :all:
          --requirement requirements-ci.txt

      - name: Ruff the policy scripts and tests
        if: matrix.python == '3.14'
        run: python -m ruff check .

      - name: Type-check the policy scripts
        run: python -m mypy

      - name: Validate the release-family canary manifest
        if: matrix.python == '3.14'
        run: python scripts/check_canaries.py

      - name: Audit live canary pins and successful-run evidence
        if: github.event_name == 'schedule' && matrix.python == '3.14'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_canaries.py --live --require-current-evidence

      - name: Check repository baseline
        if: matrix.python == '3.14'
        run: bash tests/test_repository_baseline.sh

      - name: Check the published prose for egress findings
        if: matrix.python == '3.14'
        # Layers B and C only: the layer A terms file is private and never
        # reaches CI, which is the point of keeping it out of the repository.
        # --allow-structural because SECURITY.md names a dotenv file in prose,
        # which is a shape layer B looks for and a person has already read.
        # docs/egress-check.md is excluded because it documents the reserved
        # namespace by naming it. The exclusion names the whole path, not the
        # file name, so another egress-check.md elsewhere under docs would
        # still be scanned. It is printed, and it fails if it ever stops
        # matching, so it cannot quietly become a hole.
        run: >-
          python scripts/check_egress.py
          README.md RELEASE_NOTES.md CONTRIBUTING.md SECURITY.md AGENTS.md docs
          --no-terms --allow-structural --exclude docs/egress-check.md

      - name: Run gate tests
        run: bash tests/test_gates.sh

      - name: Run commit-msg hook tests
        run: bash tests/test_commit_msg_hook.sh

      - name: Run policy tests with scoped branch coverage
        run: >-
          python -m coverage run --branch --source=scripts
          -m unittest discover -s tests -p "test_*.py" -v

      - name: Require complete changed-line coverage in Python policy scripts
        run: |
          python -m coverage xml --include="scripts/*.py" -o coverage.xml
          diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100

      - name: Run determinism test
        run: bash tests/test_determinism.sh

      - name: Install the release toolchain's uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Build the demo package offline from its lock
        run: bash tests/test_offline_build.sh

  windows:
    timeout-minutes: 15
    name: shell tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the pinned build tool
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-build.txt

      - name: Check repository baseline
        run: bash tests/test_repository_baseline.sh

      - name: Run gate and publication tests
        # test_gates.sh runs test_publish_releases.sh for both release families.
        # Its byte-exact fixtures exercise CRLF regardless of checkout settings.
        run: bash tests/test_gates.sh

      - name: Run commit-msg hook tests
        run: bash tests/test_commit_msg_hook.sh

      - name: Run determinism test
        run: bash tests/test_determinism.sh

  ci-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [checks, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml ci-gates --exempt fuzzing
