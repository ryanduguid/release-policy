name: CI

on:
  workflow_dispatch:
    inputs:
      live-canary-audit:
        description: Audit current consumer pins and live release evidence
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * 2"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces that pull request's older run.
  # Every other run is keyed on its commit, so a later merge cannot cancel
  # an earlier commit's run on main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzzing:
    name: fuzz policy parsers
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned fuzzer
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-fuzz.txt

      - name: Fuzz pure policy parsers
        run: >-
          python -m fuzz.policy_parsers fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  rust-fuzzing:
    name: fuzz the Rust policy parsers
    # The same 60-second exploration, over the same corpus, for the Rust CLI.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned fuzzer
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
          # install-action has no cargo-fuzz manifest, so the release asset is
          # checked against GitHub's digest for it at pin time.
          CARGO_FUZZ_SHA256: "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c"
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-15 --profile minimal
          asset="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/$asset"
          echo "${CARGO_FUZZ_SHA256}  $asset" | sha256sum --check
          tar -xzf "$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-fuzz

      - name: Fuzz pure policy parsers
        # The release binary is built for musl and defaults to that target,
        # where the address sanitiser cannot build; fuzz on glibc instead.
        run: >-
          cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu policy_parsers fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  release-audit:
    name: audit the binary canaries' executables
    # The publisher's checks, repeated on each binary canary's recorded
    # release, so an advisory published after a release fails this run. The
    # live canary audit fails once a newer release overtakes the recorded one,
    # so when it passes the recorded release is the latest. A job of its own:
    # after the live canary audit in checks, a failing pin check skipped it.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live-canary-audit)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned cargo-audit
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      # As docs/verify-a-release.md asks of any downloader: each archive is the
      # one line of SHA256SUMS that names it, and its provenance was signed by
      # the binary release workflow at the recorded policy commit for the
      # recorded tag and source commit.
      - name: Audit each binary canary's executables against RustSec
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/audit_binary_canaries.sh canaries.json
          "$RUNNER_TEMP/binary-canaries" "$RUNNER_TEMP/advisory-db"

  pin-lag:
    name: list the families owing a re-pin
    # A family whose files changed on main since the commit its consumers pin
    # owes them a re-pin (docs/re-pinning.md). Lag is a warning, never a
    # failure; a pin this job cannot read or compare fails it. A job of its
    # own, like release-audit, so a failing canary step cannot skip it.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live-canary-audit)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pin_families.py diffs each pin against main; a pin off main is
          # reached through its release tag.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Each canary consumer stands for its family. Attribution and VirusTotal
      # have no canary, so the skills canary's callers of them stand in.
      - name: Compare each family's consumer pin with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # check_canaries.py requires exactly one entry for each canary family.
          if ! python scripts/check_canaries.py \
            || ! consumers="$(jq -r '.families[] | "\(.policy_workflow | ltrimstr(".github/workflows/") | rtrimstr(".yml")) \(.policy_workflow) \(.repository) \(.workflow_path)"' canaries.json)"; then
            echo "::error title=Pin lag not measured::canaries.json is not a valid canary manifest"
            exit 1
          fi
          consumers+=$'\n'"attribution .github/workflows/attribution-policy.yml ryanduguid/australian-accounting-skills .github/workflows/no-ai-attribution.yml"
          consumers+=$'\n'"virustotal-release .github/workflows/virustotal-release.yml ryanduguid/australian-accounting-skills .github/workflows/virustotal.yml"
          printf '| Family | Consumer | Pin | Against main |\n| --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while read -r -u 3 family workflow repository caller; do
            pin=""
            if ! content="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$repository/contents/$caller?ref=main")"; then
              status="not measured: $repository/$caller could not be read"
            else
              # Only an active uses: line naming this workflow and a full commit SHA counts.
              uses="^[[:space:]]*(- )?uses: $GITHUB_REPOSITORY/${workflow//./\\.}@[0-9a-f]{40}([[:space:]]|$)"
              pin="$(grep -oE "$uses" <<< "$content" | sed -E 's/.*@([0-9a-f]{40}).*/\1/' | sort -u)"
              if [ -z "$pin" ] || [ "$(wc -l <<< "$pin")" -ne 1 ]; then
                status="not measured: $repository/$caller has no single $workflow pin"
              elif ! report="$(python scripts/pin_families.py "$pin" origin/main 2>&1)"; then
                status="not measured: $report"
              elif grep -qvE '^[a-z-]+: (keep the pin|re-pin \(.+\))$' <<< "$report" \
                || [ "$(grep -c "^$family: " <<< "$report")" -ne 1 ]; then
                status="not measured: pin_families.py gave no single well-formed $family verdict"
              else
                status="$(sed -n "s/^$family: //p" <<< "$report")"
              fi
            fi
            case "$status" in
              "keep the pin") ;;
              "re-pin ("*) echo "::warning title=Re-pin owed::$family ($repository) pins $pin; $status" ;;
              *) echo "::error title=Pin lag not measured::$family ($repository): $status"; failed=1 ;;
            esac
            echo "$family ($repository) ${pin:-none}: $status"
            echo "| $family | $repository | \`${pin:-none}\` | $status |" >> "$GITHUB_STEP_SUMMARY"
          done 3<<< "$consumers"
          exit "$failed"

  checks:
    timeout-minutes: 15
    name: lint and test
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    # The 26.04 canary leg below reports but never fails the job, so ci-gates
    # stays green on its failure.
    continue-on-error: ${{ matrix.runner == 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        # Test the Python 3.14 minimum and current stable Python 3.15.
        python: ["3.14", "3.15"]
        # Temporary leg on the image ubuntu-latest becomes between 19 October
        # and 19 November 2026 (actions/runner-images#14748). "3.14.x" makes it
        # a new combination, so the required check names above stay unchanged.
        # Remove it once ubuntu-latest is 26.04.
        include:
          - python: "3.14.x"
            runner: ubuntu-26.04
    env:
      # Follow the CI maintenance interpreter rather than the exact local pin.
      UV_PYTHON: ${{ matrix.python == '3.15' && '3.15' || '3.14' }}
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      # digest computed from the v0.11.0 release tarball at pin time
      # (koalaman does not publish a checksums file)
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # shellcheck and actionlint do not depend on the Python under test, so
      # they download and run once, on the 3.14 leg, like the live canary audit.
      - name: Download and verify shellcheck
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Shellcheck the scripts and tests
        if: matrix.python == '3.14'
        run: |
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -x scripts/*.sh tests/*.sh

      - name: Download and verify actionlint
        if: matrix.python == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint

      # actionlint's bundled `job` context type does not yet model `workflow_sha`,
      # which is used by the release workflows. rhysd/actionlint#707 is open to
      # add it. Until that ships, ignore this one known false positive; remove the
      # -ignore flag once #707 lands in a release.
      - name: Actionlint the workflows
        if: matrix.python == '3.14'
        run: |
          ./actionlint \
            -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            -ignore 'property "workflow_sha" is not defined in object type \{check_run_id: number; container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}' \
            .github/workflows/*.yml

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned Python tools
        run: >-
          python -m pip install
          --require-hashes --only-binary :all:
          --requirement requirements-ci.txt

      - name: Ruff the policy scripts and tests
        if: matrix.python == '3.14'
        run: python -m ruff check .

      - name: Type-check the policy scripts
        run: python -m mypy

      - name: Validate the release-family canary manifest
        if: matrix.python == '3.14'
        run: python scripts/check_canaries.py

      - name: Audit live canary pins and successful-run evidence
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.live-canary-audit)) &&
          matrix.python == '3.14'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_canaries.py --live --require-current-evidence

      - name: Check repository baseline
        if: matrix.python == '3.14'
        run: bash tests/test_repository_baseline.sh

      - name: Check the published prose for egress findings
        if: matrix.python == '3.14'
        # Layers B and C only: the layer A terms file is private and never
        # reaches CI, which is the point of keeping it out of the repository.
        # --allow-structural because SECURITY.md names a dotenv file in prose,
        # which is a shape layer B looks for and a person has already read.
        # docs/egress-check.md is excluded because it documents the reserved
        # namespace by naming it. The exclusion names the whole path, not the
        # file name, so another egress-check.md elsewhere under docs would
        # still be scanned. It is printed, and it fails if it ever stops
        # matching, so it cannot quietly become a hole.
        run: >-
          python scripts/check_egress.py
          README.md RELEASE_NOTES.md CONTRIBUTING.md SECURITY.md AGENTS.md docs
          --no-terms --allow-structural --exclude docs/egress-check.md

      - name: Run gate tests
        run: bash tests/test_gates.sh

      - name: Run commit-msg hook tests
        run: bash tests/test_commit_msg_hook.sh

      - name: Run policy tests with scoped branch coverage
        run: >-
          python -m coverage run --branch --source=scripts
          -m unittest discover -s tests -p "test_*.py" -v

      - name: Require complete changed-line coverage in Python policy scripts
        run: |
          python -m coverage xml --include="scripts/*.py" -o coverage.xml
          diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100

      - name: Require complete coverage of the policy scripts
        if: matrix.python == '3.15'
        run: python -m coverage report --fail-under=100

      - name: Write whole-package coverage for Codecov
        if: matrix.python == '3.15'
        run: python -m coverage xml -o coverage-codecov.xml

      - name: Keep the coverage report for the Codecov upload
        if: matrix.python == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1

      - name: Run determinism test
        run: bash tests/test_determinism.sh

      - name: Install the release toolchain's uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Build the demo package offline from its lock
        run: bash tests/test_offline_build.sh

  windows:
    timeout-minutes: 15
    name: shell tests (Windows, ${{ matrix.part }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # scripts/publish_common.sh writes fixed /tmp paths, so the
        # publication families cannot run concurrently on one runner.
        part: [gates, archives, python, binaries]
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install the pinned build tool
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-build.txt

      - name: Check repository baseline
        if: matrix.part == 'gates'
        run: bash tests/test_repository_baseline.sh

      - name: Run gate tests
        if: matrix.part == 'gates'
        # The publication families run in the other matrix legs.
        # test_gates.sh's byte-exact fixtures exercise CRLF regardless of checkout settings.
        env:
          GATES_SKIP_PUBLICATION: "1"
        run: bash tests/test_gates.sh

      - name: Run commit-msg hook tests
        if: matrix.part == 'gates'
        run: bash tests/test_commit_msg_hook.sh

      - name: Run determinism test
        if: matrix.part == 'gates'
        run: bash tests/test_determinism.sh

      - name: Run ${{ matrix.part }} publication tests
        if: matrix.part != 'gates'
        env:
          PART: ${{ matrix.part }}
        run: bash tests/test_publish_releases.sh "$PART"

  # The Rust CLI that replaces the policy scripts once a release of it is
  # published. Until then the reusable workflows keep calling the scripts,
  # so both are tested.
  rust:
    timeout-minutes: 30
    name: Rust CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # rust-toolchain.toml pins the same release.
      RUST_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt,llvm-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned cargo-llvm-cov
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint the CLI and its tests
        run: cargo clippy --locked --all-targets -- -D warnings

      # The floor is the measured line coverage, rounded down (92.15% on
      # 19 October 2026). Raise it with the tests, never lower it to pass.
      - name: Run the CLI tests with line coverage
        run: cargo llvm-cov --locked --lcov --output-path coverage-rust-${{ runner.os }}.lcov --fail-under-lines 92

      - name: Use repository-relative coverage paths
        shell: pwsh
        run: |
          $report = "coverage-rust-$env:RUNNER_OS.lcov"
          $prefix = $env:GITHUB_WORKSPACE.Replace([IO.Path]::DirectorySeparatorChar, '/').TrimEnd('/') + '/'
          $lines = Get-Content -LiteralPath $report | ForEach-Object {
            if ($_.StartsWith('SF:')) {
              $path = $_.Substring(3).Replace([IO.Path]::DirectorySeparatorChar, '/')
              if (-not $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Coverage source is outside the repository'
              }
              'SF:' + $path.Substring($prefix.Length)
            } else { $_ }
          }
          $lines | Set-Content -LiteralPath $report -Encoding utf8

      - name: Keep the Rust coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust-${{ runner.os }}
          path: coverage-rust-${{ runner.os }}.lcov
          retention-days: 1

      # A second, release-profile compile that no CI step uses, so pull requests
      # skip it; the tests already run the debug binary. Main, the weekly run
      # and manual runs keep the documented release build compiling.
      - name: Build the release binary
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --bin release-policy

  # The binary release family's build path, run on this repository's own CLI
  # for each target. It publishes nothing; binary-sbom-check then takes the
  # artefacts as the release's admit job would.
  binary-self-check:
    timeout-minutes: 45
    name: binary release self-check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      PYTHON: python
    steps:
      - name: Check out files exactly as committed
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned cargo-auditable
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Link the C runtime statically
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test, build, package and check the executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])' | tr -d '\r')"
          bash scripts/build_binary.sh "$TARGET" release-policy "$version" release-policy \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/binary" \
            "$(git log -1 --format=%ct)" ""

      - name: Keep the archive for the SBOM check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-self-check-${{ matrix.target }}
          path: ${{ runner.temp }}/binary/
          if-no-files-found: error
          retention-days: 1

  binary-sbom-check:
    timeout-minutes: 15
    name: binary release SBOM check
    needs: binary-self-check
    runs-on: ubuntu-24.04
    env:
      TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download the Linux archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-self-check-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/x86_64-unknown-linux-musl

      - name: Download the Linux arm64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-self-check-aarch64-unknown-linux-musl
          path: ${{ runner.temp }}/incoming/aarch64-unknown-linux-musl

      - name: Download the macOS arm64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-self-check-aarch64-apple-darwin
          path: ${{ runner.temp }}/incoming/aarch64-apple-darwin

      - name: Download the Windows archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-self-check-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/incoming/x86_64-pc-windows-msvc

      - name: Admit each archive as the publisher does
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          for target in $TARGETS; do
            python scripts/binary_release.py receive \
              --incoming "$RUNNER_TEMP/incoming/$target" --stem release-policy --version "$version" \
              --binary release-policy --target "$target" --dist "$RUNNER_TEMP/dist" \
              --extract-dir "$RUNNER_TEMP/extracted/$target" --source . --root .
          done

      - name: Require each admitted executable's linkage as the admit job does
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          bash scripts/admitted_linkage.sh "$RUNNER_TEMP/extracted" release-policy "${targets[@]}"

      # Only the executables: a data file such as a lock file in the admitted
      # directory would add packages the target does not ship.
      - name: Stage each target's executables for its SBOM
        env:
          BINARY: release-policy
        shell: bash
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            suffix=""
            [[ "$target" != *-windows-msvc ]] || suffix=.exe
            mkdir -p "$RUNNER_TEMP/sbom/$target"
            for name in $BINARY; do
              cp "$RUNNER_TEMP/extracted/$target/$name$suffix" "$RUNNER_TEMP/sbom/$target/"
            done
          done

      # As the admit job does: each target's staged executables.
      - name: Generate the Linux binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/x86_64-unknown-linux-musl
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/linux.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the Linux arm64 binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/aarch64-unknown-linux-musl
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the macOS arm64 binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/aarch64-apple-darwin
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/macos-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the Windows binary's SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom/x86_64-pc-windows-msvc
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/windows.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # cargo-auditable embeds the target's own dependency list: a direct and
      # a transitive dependency on each, and a platform crate only on its
      # platforms. The list also keeps optional dependencies cargo tree drops,
      # so rustix's errno and libc appear for Linux too; core-foundation-sys
      # is the crate only macOS lists (the self-check archives, 10 November
      # 2026).
      - name: Require each SBOM to describe its own target's dependencies
        run: |
          set -euo pipefail
          lists() { python scripts/binary_release.py sbom-lists --sbom "$RUNNER_TEMP/$1.spdx.json" --package "$2"; }
          for sbom in linux linux-arm64 macos-arm64 windows; do
            for package in release-policy regex regex-automata; do
              lists "$sbom" "$package"
            done
          done
          lists linux linux-raw-sys
          lists linux-arm64 linux-raw-sys
          lists macos-arm64 core-foundation-sys
          lists windows windows-sys
          if lists linux windows-sys || lists linux-arm64 core-foundation-sys \
              || lists macos-arm64 linux-raw-sys \
              || lists windows rustix; then
            echo "an SBOM lists another platform's crate" >&2
            exit 1
          fi

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from ci-gates: a Codecov outage must
  # not block merges.
  codecov:
    name: upload coverage to Codecov
    needs: [checks, rust]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-rust-*
          merge-multiple: true
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml,coverage-rust-Linux.lcov,coverage-rust-Windows.lcov
          disable_search: true
          fail_ci_if_error: true

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without advanced security a finding fails this job and no write permission
      # is needed. .github/zizmor.yml records each accepted finding. Informational
      # findings are 34 low-confidence template expansions of earlier steps'
      # outputs in release-python.yml and publish-archives.yml. At 1.32.0 a step
      # output reports informational whatever it holds, so this does not check what
      # those outputs carry; pull_request.title, head_ref and inputs report high and
      # fail here.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          min-severity: low

  ci-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [checks, windows, rust, binary-self-check, binary-sbom-check, zizmor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml ci-gates --exempt fuzzing --exempt rust-fuzzing --exempt release-audit --exempt pin-lag --exempt codecov
