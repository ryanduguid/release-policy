version: 2
updates:
  - package-ecosystem: github-actions
    # directory: / covers .github/workflows and a root-level action.yml only,
    # so the pins inside the composite action were never proposed for update.
    directories:
      - /
      - /.github/actions/no-ai-attribution
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # move together: a job running one release against the other's config
      # fails outright. Grouped so the pair can never arrive split.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /fixtures/demo-pkg
    schedule:
      interval: monthly
