# Accepted zizmor findings, each with its reason. An entry names a file and line,
# so moving the line fails CI and brings the reason back for review.
rules:
  dangerous-triggers:
    ignore:
      # Runs only the attribution policy from the trusted base branch, never pull
      # request code.
      - no-ai-attribution.yml:13
  artipacked:
    ignore:
      # Fixing this needs a change to the action and then a repin of
      # attribution-policy.yml in a second pull request (CONTRIBUTING.md). Its caller
      # uploads no artefact, so the persisted credential does not leave the job.
      - action.yml:15
  self-repository:
    ignore:
      # The suggested $/ syntax is rejected by the pinned actionlint 1.7.12, and the
      # pin family tests require these relative calls.
      - no-ai-attribution.yml:40
      - release-archive.yml:172
      - release-skills.yml:94
      - release-skills.yml:105
